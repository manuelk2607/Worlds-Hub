name: Verify and deploy Worlds Hub
# Manual until account free Actions allowance and deployment token are confirmed.
# This avoids starting paid hosted-runner minutes on every push.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy checked commit to worlds-hub.maki26.workers.dev
        type: boolean
        default: false
      initialize_identity_secret:
        description: Initialize missing identity signing secret (explicit pilot setup only)
        type: boolean
        default: false
      device_sign_out_pilot:
        description: Temporarily enable device sign-out for the configured test identity and test workers
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: worlds-hub-production
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
      SITE_ORIGIN: https://worlds-hub.maki26.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Check deployment credential
        if: inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing repository secret CLOUDFLARE_API_TOKEN'; exit 1; }
      - name: Validate pilot deployment selection
        if: inputs.device_sign_out_pilot
        env:
          DEPLOY: ${{ inputs.deploy }}
          INITIALIZE_IDENTITY_SECRET: ${{ inputs.initialize_identity_secret }}
        run: test "$DEPLOY" = true && test "$INITIALIZE_IDENTITY_SECRET" = false && test "$GITHUB_REF" = refs/heads/main
      - name: Initialize identity secret only when explicitly requested
        if: inputs.deploy && inputs.initialize_identity_secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INITIALIZE_IDENTITY_SECRET: 'true'
        run: node --experimental-strip-types scripts/init-identity-secret.ts
      - name: Deploy only the checked Worlds Hub Worker
        if: inputs.deploy && !inputs.device_sign_out_pilot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:cloudflare
      - name: Deploy only the checked Worlds Hub sign-out pilot
        if: inputs.deploy && inputs.device_sign_out_pilot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IDENTITY_DEVICE_SIGN_OUT_PILOT: ${{ secrets.IDENTITY_DEVICE_SIGN_OUT_PILOT }}
          WORLDS_SESSION_EVENT_PRIVATE_JWK: ${{ secrets.WORLDS_SESSION_EVENT_PRIVATE_JWK }}
        run: node --experimental-strip-types scripts/deploy-device-sign-out-pilot.ts
      - name: Verify production
        if: inputs.deploy
        env:
          EXPECT_DEVICE_SIGN_OUT_PILOT: ${{ inputs.device_sign_out_pilot }}
        run: npm run smoke
